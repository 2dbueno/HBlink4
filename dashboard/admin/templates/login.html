<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | BuenoDMR</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <main class="login-shell">
        <a class="back-link" href="/">&larr; Dashboard</a>
        <div class="login-panel">
            <p class="eyebrow">BuenoDMR</p>
            <h1>Administration</h1>
            <p class="subtle">Sign in with your administrative account.</p>
            <p class="error" role="alert">{{ERROR}}</p>
            <form method="post" action="/admin/login">
                <input type="hidden" name="csrf" value="{{CSRF}}">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
