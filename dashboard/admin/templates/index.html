<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration | BuenoDMR</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
    <main class="admin-shell">
        <header>
            <div>
                <a class="back-link" href="/">&larr; Dashboard</a>
                <p class="eyebrow">BuenoDMR</p>
                <h1>BuenoDMR Administration</h1>
            </div>
            <div class="account">
                <span>Signed in as <strong>{{USERNAME}}</strong></span>
                <form method="post" action="/admin/logout">
                    <input type="hidden" name="csrf" value="{{CSRF}}">
                    <button class="secondary" type="submit">Logout</button>
                </form>
            </div>
        </header>
        <section aria-labelledby="operators-title">
            <div class="section-head">
                <h2 id="operators-title">DMR Operators</h2>
                <span class="read-only">Read-only configuration</span>
            </div>
            <div class="operators">{{OPERATORS}}</div>
        </section>
    </main>
</body>
</html>
